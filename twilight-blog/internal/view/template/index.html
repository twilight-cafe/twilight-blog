<!doctype html>
<!--
  公开站点的 HTML 外壳。**它由 Go 后端渲染**，不在前端工程里（twilight-web 只留
  src/main.tsx 作为构建入口，vite 配置成 manifest 模式产出资源清单）。

  为什么外壳要搬到服务端：`<meta name="description">` 与 `<title>` 是**站点级文案**，
  它们的正确值只有后端知道（存在 settings.json 里，见 GET /api/site）。留在
  前端工程里的话，它们在 SPA 启动之前只能是写死的默认值——用户会先看到「默认描述」
  再被 JS 改成「真实描述」，而这个窗口对不执行 JS 的抓取器则是**永久的**。

  四个占位符由 view/index.go 填充（dev 服务器由 vite.config.ts 的同名占位符填充）：
    .Description   站点描述（未设置时为内置默认值，与服务端同一份常量）
    .Stylesheets   入口 chunk 依赖的样式表（来自 .vite/manifest.json）
    .Scripts       入口 chunk（同上；带内容指纹的文件名只有构建后才知道）
    .SearchEnabled 站点功能开关，作为 <html> 的属性下发（见下方说明）
    .HomePageSize  首页每页文章数，同上走属性通道
    .BorderRadius  站点统一圆角（px），同上走属性通道

  **站点功能开关为什么走 HTML 属性，而不是内联 <script>**：
  响应头里的 CSP 是 `script-src 'self'`，且不含 'unsafe-inline'/hash/nonce
  （见 middleware/security.go），浏览器会**拒绝执行**本页任何内联脚本。
  这里曾经写着 `<script>window.__SITE__ = { searchEnabled: ... }</script>`，
  于是那个开关在真实浏览器里从未生效过：关掉搜索时前端读不到 false，
  走「缺省=全开」兜底，照样渲染出搜索入口，点进去 404。
  而当时所有测试都是绿的——它们只断言「HTML 文本里有这个字符串」，
  不断言「浏览器肯执行它」。
  属性通道由 HTML 解析即得，同样在入口 chunk 之前就绪，且不必放宽 CSP。
  再加开关就再加一个 data-* 属性；**不要退回内联脚本**。

  改动这里的资源引用方式时，记得 build.py 的 verify_manifest_assets 也依赖
  manifest.json —— 它才是「资源引用与产物是否对得上」的权威来源。
-->
<html lang="zh-CN" data-locale="zh" data-mode="light" data-search-enabled="{{.SearchEnabled}}" data-home-page-size="{{.HomePageSize}}" data-border-radius="{{.BorderRadius}}" data-post-banner-height="{{.PostBannerHeight}}" data-moments-enabled="{{.MomentsEnabled}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{.Description}}" />
{{range .Stylesheets}}    <link rel="stylesheet" href="{{.}}" />
{{end}}{{range .Scripts}}    <script type="module" src="{{.}}"></script>
{{end}}    <title>{{.Title}}</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
